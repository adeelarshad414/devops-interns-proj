# Forward (egress) proxy — a destination ALLOW-LIST.
#
# A reverse proxy guards what comes IN; a forward proxy guards what goes OUT.
# Every outbound call from the app tier is funnelled here, and only the hosts on
# the allow-list may leave the network. Everything else is refused with 403 and
# logged — which is the entire point: a forward proxy turns "the app can reach
# the whole internet" into "the app can reach the payment provider, and we have
# the receipt."

http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# The allow-list. In real life this is the payment provider, a package registry,
# etc. `.example.com` matches example.com and its subdomains. Add yours here.
acl allowed_dst dstdomain .example.com .stripe.com .githubusercontent.com

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access deny all                 # anything not allow-listed → 403

# Log every outbound decision to stdout — the audit trail is the value.
access_log stdio:/dev/stdout squid
cache deny all

ctive</text><text x="754" y="298" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">injects a fault →</text><text x="754" y="326" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">probes live state, scores it</text><rect x="70" y="800" width="400" height="150" rx="18" fill="#16233c" fill-opacity="1" stroke="#A78BFA" stroke-width="2"/><rect x="70" y="800" width="6" height="150" rx="3" fill="#A78BFA" fill-opacity="1"/><circle cx="100" cy="840" r="8" fill="#A78BFA"/><text x="118" y="847" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="23" font-weight="700" fill="#E2E8F0" fill-opacity="1" text-anchor="start">LLMOps + AI-security</text><text x="454" y="845" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700" fill="#A78BFA" fill-opacity="1" text-anchor="end">OWASP-LLM</text><text x="94" y="888" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">vulnerable vs hardened →</text><text x="94" y="916" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">red-team gate + cost SLO</text><rect x="730" y="800" width="400" height="150" rx="18" fill="#16233c" fill-opacity="1" stroke="#FBBF24" stroke-width="2"/><rect x="730" y="800" width="6" height="150" rx="3" fill="#FBBF24" fill-opacity="1"/><circle cx="760" cy="840" r="8" fill="#FBBF24"/><text x="778" y="847" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="23" font-weight="700" fill="#E2E8F0" fill-opacity="1" text-anchor="start">Infracost cost gate</text><text x="1114" y="845" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700" fill="#FBBF24" fill-opacity="1" text-anchor="end">FinOps</text><text x="7
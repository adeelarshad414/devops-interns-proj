<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200"><defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="1200" fill="#0A1120"/><rect x="0" y="0" width="1200" height="430" fill="url(#g0)"/><text x="80" y="96" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="700" fill="#22D3EE" fill-opacity="1" text-anchor="start" letter-spacing="2.5">DEVOPS  ·  SRE  ·  PLATFORM ENGINEERING  ·  AI-NATIVE</text><text x="78" y="196" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="78" font-weight="800" fill="#E2E8F0" fill-opacity="1" text-anchor="start">Daig, reimagined</text><text x="80" y="258" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="29" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">Four AI-native capabilities layered on an open-source</text><text x="80" y="298" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="29" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">DevOps teaching platform — each one measured, not just read.</text><rect x="80" y="372" width="498" height="232" rx="20" fill="#16233c" fill-opacity="1" stroke="#26364f" stroke-width="1.6"/><rect x="80" y="372" width="7" height="232" rx="3.5" fill="#22D3EE" fill-opacity="1"/><circle cx="114" cy="416" r="9" fill="#22D3EE"/><text x="134" y="424" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#E2E8F0" fill-opacity="1" text-anchor="start">AI Incident Copilot</text><rect x="428" y="398" width="130" height="30" rx="15" fill="#0C1830" fill-opacity="1" stroke="#22D3EE" stroke-width="1.4"/><text x="493" y="419" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700" fill="#22D3EE" fill-opacity="1" text-anchor="middle">AIOps</text><text x="106" y="468" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">Reads live Prometheus / Loki / Tempo,</text><text x="106" y="498" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">ranks root-cause hypotheses, and grades</text><text x="106" y="528" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">itself (accuracy@1 / @3 vs a baseline).</text><rect x="622" y="372" width="498" height="232" rx="20" fill="#16233c" fill-opacity="1" stroke="#26364f" stroke-width="1.6"/><rect x="622" y="372" width="7" height="232" rx="3.5" fill="#34D399" fill-opacity="1"/><circle cx="656" cy="416" r="9" fill="#34D399"/><text x="676" y="424" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#E2E8F0" fill-opacity="1" text-anchor="start">Auto-grader arena</text><rect x="970" y="398" width="130" height="30" rx="15" fill="#0C1830" fill-opacity="1" stroke="#34D399" stroke-width="1.4"/><text x="1035" y="419" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700" fill="#34D399" fill-opacity="1" text-anchor="middle">interactive</text><text x="648" y="468" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">A challenge injects a fault; you fix it;</text><text x="648" y="498" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">the grader probes live state and scores</text><text x="648" y="528" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">the fix, per check, with a hint on misses.</text><rect x="80" y="636" width="498" height="232" rx="20" fill="#16233c" fill-opacity="1" stroke="#26364f" stroke-width="1.6"/><rect x="80" y="636" width="7" height="232" rx="3.5" fill="#A78BFA" fill-opacity="1"/><circle cx="114" cy="680" r="9" fill="#A78BFA"/><text x="134" y="688" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#E2E8F0" fill-opacity="1" text-anchor="start">LLMOps + AI-security</text><rect x="428" y="662" width="130" height="30" rx="15" fill="#0C1830" fill-opacity="1" stroke="#A78BFA" stroke-width="1.4"/><text x="493" y="683" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700" fill="#A78BFA" fill-opacity="1" text-anchor="middle">OWASP-LLM</text><text x="106" y="732" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">A support agent, vulnerable vs hardened;</text><text x="106" y="762" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">a red-team eval gate (100% -&gt; 0% exploit)</text><text x="106" y="792" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">and a per-call token-cost SLO.</text><rect x="622" y="636" width="498" height="232" rx="20" fill="#16233c" fill-opacity="1" stroke="#26364f" stroke-width="1.6"/><rect x="622" y="636" width="7" height="232" rx="3.5" fill="#FBBF24" fill-opacity="1"/><circle cx="656" cy="680" r="9" fill="#FBBF24"/><text x="676" y="688" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#E2E8F0" fill-opacity="1" text-anchor="start">Infracost cost gate</text><rect x="970" y="662" width="130" height="30" rx="15" fill="#0C1830" fill-opacity="1" stroke="#FBBF24" stroke-width="1.4"/><text x="1035" y="683" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700" fill="#FBBF24" fill-opacity="1" text-anchor="middle">FinOps</text><text x="648" y="732" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">Every infra PR gets a monthly-cost diff</text><text x="648" y="762" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">commented on it, plus a guardrail that</text><text x="648" y="792" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start">fails the build past a $ threshold.</text><rect x="80" y="908" width="1040" height="96" rx="18" fill="#0C1830" fill-opacity="1" stroke="#26364f" stroke-width="1.6"/><text x="600" y="952" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="700" fill="#E2E8F0" fill-opacity="1" text-anchor="middle">Every capability ships as an eval or a gate wired into CI.</text><text x="600" y="984" font-family="Menlo,ui-monospace,monospace" font-size="16" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="middle">eval@copilot   ·   grade@arena   ·   red-team@ai-security   ·   cost-gate@finops</text><text x="600" y="1112" font-family="Menlo,ui-monospace,monospace" font-size="20" font-weight="600" fill="#475569" fill-opacity="1" text-anchor="middle">github.com/adeelarshad414/devops-interns-proj</text></svg>
# TEACHING ARTIFACT ONLY. Registered dummies - see DUMMY-VALUES.md.
#
# In production this file does not exist. Use External Secrets Operator, Sealed
# Secrets, or the cloud CSI driver against Secrets Manager / Secret Manager /
# Key Vault. A Secret manifest in Git is the habit we are trying not to teach.
apiVersion: v1
kind: Secret
metadata:
  name: daig-secrets
  annotations:
    # Marks this as an intentional, registered teaching artifact so the policy
    # gate (security/policy/kubernetes.rego) allows it. Real Secrets never carry
    # inline stringData in Git - see the header above.
    daig.tkxel/teaching-artifact: "true"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_DEV_ONLY"
  JWT_SECRET: "CHANGE_ME_DEV_ONLY"
  PAYMENT_API_KEY: "CHANGE_ME_DEV_ONLY"
  DATABASE_URL: "postgresql://daig:CHANGE_ME_DEV_ONLY@postgres:5432/daig"

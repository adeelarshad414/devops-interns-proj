apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: daig

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - orders.yaml
  - kitchen.yaml
  - dispatch.yaml
  - web.yaml
  - hpa.yaml

# `labels` replaces the deprecated `commonLabels`. includeSelectors:false keeps
# these off pod selectors, so changing a label later can't orphan a ReplicaSet.
labels:
  - pairs:
      app.kubernetes.io/part-of: daig
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# Pin an immutable tag, never :latest. Two pods of one Deployment must never run
# different code, and `kubectl rollout undo` needs a distinct prior tag to
# return to. Bump this (or set a digest) per release via your CD pipeline.
images:
  - name: daig-orders
    newName: ghcr.io/adeelarshad414/daig/orders
    newTag: "1.0.0"
  - name: daig-kitchen
    newName: ghcr.io/adeelarshad414/daig/kitchen
    newTag: "1.0.0"
  - name: daig-dispatch
    newName: ghcr.io/adeelarshad414/daig/dispatch
    newTag: "1.0.0"
  - name: daig-web
    newName: ghcr.io/adeelarshad414/daig/web
    newTag: "1.0.0"

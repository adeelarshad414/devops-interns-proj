apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    tier: presentation
spec:
  # replicas owned by the HorizontalPodAutoscaler (see hpa.yaml). Do not set both.
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels:
        app: web
        tier: presentation
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: web }
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: daig-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Startup gives a slow first boot room before liveness starts killing.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # ClusterIP behind an Ingress is the production shape: TLS termination,
  # host/path routing, and ONE load balancer for the whole cluster instead of a
  # raw L4 LoadBalancer (and a cloud LB) per service. The Ingress is in
  # ingress.yaml. On a controller-free demo cluster, reach it with
  # `kubectl -n daig port-forward svc/web 8080:80`.
  type: ClusterIP
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web

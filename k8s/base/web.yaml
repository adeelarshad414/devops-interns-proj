apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    tier: presentation
spec:
  # replicas owned by the HorizontalPodAutoscaler (see hpa.yaml). Do not set both.
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels:
        app: web
        tier: presentation
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: web }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # the 'nginx' user in nginxinc/nginx-unprivileged
        fsGroup: 101            # so the emptyDir /tmp and cache are writable by nginx
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: daig-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Startup gives a slow first boot room before liveness starts killing.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          volumeMounts:
            # nginx-unprivileged writes its pid and temp files under /tmp and its
            # caches under /var/cache/nginx; writable emptyDirs let the root
            # filesystem stay read-only.
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # ClusterIP behind an Ingress is the production shape: TLS termination,
  # host/path routing, and ONE load balancer for the whole cluster instead of a
  # raw L4 LoadBalancer (and a cloud LB) per service. The Ingress is in
  # ingress.yaml. On a controller-free demo cluster, reach it with
  # `kubectl -n daig port-forward svc/web 8080:80`.
  type: ClusterIP
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web

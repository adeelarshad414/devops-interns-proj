apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen
  labels:
    app: kitchen
    tier: application
spec:
  # replicas owned by the HorizontalPodAutoscaler (see hpa.yaml). Do not set both.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One at a time, never below full capacity. A bad image cannot take the
      # service down because unavailable pods are never allowed.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kitchen
  template:
    metadata:
      labels:
        app: kitchen
        tier: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      # Graceful shutdown: preStop delays SIGTERM so endpoints deregister first,
      # then the app drains (server -> pool -> telemetry, see _shared/shutdown.js).
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: kitchen }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kitchen
          image: daig-kitchen:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: daig-config
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daig-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daig-secrets
                  key: JWT_SECRET
          # Liveness does NOT touch the database. A slow database must not
          # cause Kubernetes to kill otherwise-healthy pods - that turns a
          # degradation into an outage.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness DOES. An instance that cannot reach its data should be
          # taken out of the Service until it can.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kitchen
  labels:
    app: kitchen
spec:
  type: ClusterIP
  selector:
    app: kitchen
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kitchen
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kitchen

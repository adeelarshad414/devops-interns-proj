# log_format MUST live in the http context. This file is included from inside
# nginx's http{} block (via conf.d/*.conf), so the directive belongs here at the
# top level — NOT inside server{}, where nginx refuses to start with
# `[emerg] "log_format" directive is not allowed here`.
log_format json_combined escape=json '{'
    '"time":"$time_iso8601",'
    '"service":"web",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,'
    '"request_id":"$request_id",'
    '"traceparent":"$http_traceparent"'
'}';

# Rate limiting — a gateway protects the backends it fronts. 20 req/s per client
# IP, buffered up to a burst. This is what turns "reverse proxy" into "lightweight
# API gateway". limit_req_zone lives in the http context, like log_format.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Keepalive upstreams — reuse backend TCP connections instead of a fresh connect
# per request. Meaningful latency saved under the iftar spike. (In Kubernetes
# these names resolve to a stable Service ClusterIP; in Compose to the container.
# For dynamic re-resolution you'd add a `resolver` + variable proxy_pass, at the
# cost of upstream keepalive — a trade worth discussing on Day 3.)
upstream orders_up   { server orders:3001;   keepalive 16; }
upstream kitchen_up  { server kitchen:3002;  keepalive 16; }
upstream dispatch_up { server dispatch:3003; keepalive 16; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    access_log /var/log/nginx/access.log json_combined;

    # ---- shared reverse-proxy / gateway behaviour (applies to every /api hop) ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";            # required for upstream keepalive
    # Let the backend see the real client, host, and scheme — not nginx.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    # Trace context must survive the proxy hop or the frontend span never joins
    # the backend trace. This is why the traces look right.
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate  $http_tracestate;
    # Bounded timeouts — a slow backend must not pin a worker at the 60s default.
    proxy_connect_timeout 3s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;
    # Retry the next upstream on a connection error / timeout (idempotent hops).
    proxy_next_upstream error timeout http_502 http_503;

    location /healthz { access_log off; return 200 '{"ok":true,"service":"web"}\n'; }

    location /api/orders      { limit_req zone=api burst=40 nodelay; proxy_pass http://orders_up; }
    location /api/restaurants { limit_req zone=api burst=40 nodelay; proxy_pass http://orders_up; }
    location /api/kitchen     { limit_req zone=api burst=40 nodelay; proxy_pass http://kitchen_up; }
    location /api/dispatch    { limit_req zone=api burst=40 nodelay; proxy_pass http://dispatch_up; }

    location / { try_files $uri $uri/ /index.html; }
}

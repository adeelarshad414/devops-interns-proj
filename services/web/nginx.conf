# log_format MUST live in the http context. This file is included from inside
# nginx's http{} block (via conf.d/*.conf), so the directive belongs here at the
# top level — NOT inside server{}, where nginx refuses to start with
# `[emerg] "log_format" directive is not allowed here`.
log_format json_combined escape=json '{'
    '"time":"$time_iso8601",'
    '"service":"web",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,'
    '"request_id":"$request_id",'
    '"traceparent":"$http_traceparent"'
'}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trace context must survive the proxy hop or the frontend span never
    # joins the backend trace. This single line is why the traces look right.
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate  $http_tracestate;
    proxy_set_header X-Request-Id $request_id;

    access_log /var/log/nginx/access.log json_combined;

    location /healthz { access_log off; return 200 '{"ok":true,"service":"web"}\n'; }

    location /api/orders      { proxy_pass http://orders:3001; }
    location /api/restaurants { proxy_pass http://orders:3001; }
    location /api/kitchen     { proxy_pass http://kitchen:3002; }
    location /api/dispatch    { proxy_pass http://dispatch:3003; }

    location / { try_files $uri $uri/ /index.html; }
}

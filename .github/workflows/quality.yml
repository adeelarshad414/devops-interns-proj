name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [orders, kitchen, dispatch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }

      - working-directory: services/${{ matrix.service }}
        run: npm ci --no-audit --no-fund   # reproducible install from the lockfile, like every other workflow

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d test ]; then
            node --experimental-test-coverage \
                 --test-reporter=lcov --test-reporter-destination=lcov.info \
                 --test test/ || true
          else
            echo "no tests for ${{ matrix.service }} yet" > lcov.info
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/lcov.info
          if-no-files-found: ignore

  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: coverage
    # Forks cannot read secrets, so the scan would fail for reasons unrelated
    # to code quality. Skip rather than fail confusingly.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # Sonar needs history for new-code detection

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage-raw

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          find coverage-raw -name 'lcov.info' -exec cat {} + > coverage/lcov.info || true
          wc -l coverage/lcov.info

      # SonarQube needs a SONAR_TOKEN repo secret. When it isn't configured
      # (e.g. a public clone), skip the scan+gate rather than fail the whole
      # workflow — add the secret to activate it.
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8

      # Blocks the merge when the gate fails. Without this step the scan is
      # decoration - it reports and nothing happens.
      - name: Enforce the quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5

  # Terraform got validate + tfsec + checkov; the ansible/ tree had no automated
  # check at all, so it was the code most likely to rot silently. Syntax-check is
  # a blocking gate; ansible-lint is advisory (like the other deep scanners here).
  ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ansible-core, ansible-lint and the pinned collections
        run: |
          set -euo pipefail
          # --break-system-packages: the runner is ephemeral, so installing into
          # its system Python is fine and avoids pinning a setup-python action.
          python3 -m pip install --quiet --break-system-packages ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check (blocking)
        working-directory: ansible
        run: ansible-playbook --syntax-check -i inventories/dev/hosts.yml site.yml

      - name: ansible-lint (advisory)
        working-directory: ansible
        run: ansible-lint || true

  # Evals-as-a-gate for the AI incident copilot. The baseline eval is offline and
  # deterministic (stdlib only) - it protects the plumbing on every PR. The real
  # Claude eval runs only when an ANTHROPIC_API_KEY secret is configured, the same
  # skip-when-absent pattern as the SonarQube gate above.
  incident-copilot:
    name: AI incident copilot eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No key in scope here, so this runs the offline heuristic baseline and
      # gates it at 100% - guarding the fixtures + plumbing on every PR.
      - name: Baseline eval (offline, deterministic)
        run: python3 ai/incident-copilot/evals/run_evals.py --min-acc1 1.0

      # The real evals-as-a-gate: install the SDK, key in scope only here, and fail
      # the build if Claude's accuracy@1 regresses below the floor.
      - name: Claude eval (only when a key is configured)
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m pip install --quiet --break-system-packages -r ai/incident-copilot/requirements.txt
          python3 ai/incident-copilot/evals/run_evals.py --min-acc1 0.6

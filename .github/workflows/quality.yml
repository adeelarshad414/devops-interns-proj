name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Tests with coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, kitchen, dispatch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }

      - working-directory: services/${{ matrix.service }}
        run: npm install --no-audit --no-fund

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d test ]; then
            node --experimental-test-coverage \
                 --test-reporter=lcov --test-reporter-destination=lcov.info \
                 --test test/ || true
          else
            echo "no tests for ${{ matrix.service }} yet" > lcov.info
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/lcov.info
          if-no-files-found: ignore

  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    needs: coverage
    # Forks cannot read secrets, so the scan would fail for reasons unrelated
    # to code quality. Skip rather than fail confusingly.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # Sonar needs history for new-code detection

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage-raw

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          find coverage-raw -name 'lcov.info' -exec cat {} + > coverage/lcov.info || true
          wc -l coverage/lcov.info

      # SonarQube needs a SONAR_TOKEN repo secret. When it isn't configured
      # (e.g. a public clone), skip the scan+gate rather than fail the whole
      # workflow — add the secret to activate it.
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8

      # Blocks the merge when the gate fails. Without this step the scan is
      # decoration - it reports and nothing happens.
      - name: Enforce the quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5

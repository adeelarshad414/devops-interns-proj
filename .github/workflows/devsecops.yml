name: DevSecOps

# The full security pipeline, ordered cheapest-and-fastest first.
#
# THE DESIGN PRINCIPLE worth teaching from this file: gates are ordered by how
# fast they fail and how cheap the fix is. Secret scanning takes 20 seconds and
# a leaked key must never merge, so it goes first. DAST needs the whole stack
# running and takes minutes, so it goes last. If a developer waits 12 minutes to
# learn about a typo, they stop trusting the pipeline - and a pipeline people
# work around protects nobody.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Code does not change; the vulnerability database does. Yesterday's clean
    # scan says nothing about today.
    - cron: '0 4 * * *'

permissions:
  contents: read
  security-events: write
  id-token: write        # OIDC for keyless signing. No long-lived keys.
  packages: write

jobs:
  # ---------------------------------------------------------------- 1. SECRETS
  secrets:
    name: 1 · Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # a secret deleted in the latest commit is still in history

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registered dummy values must not escape their allowed files
        run: |
          set -euo pipefail
          # Kept identical to ci.yml. The registered placeholder legitimately
          # lives in docs, the scanners that detect it (services/_shared/*), the
          # dev-default Dockerfile, chaos dev scripts and dev-only compose —
          # see DUMMY-VALUES.md. The gate fires when it appears anywhere else.
          ALLOWED='(\.env\.example|DUMMY-VALUES\.md|README\.md|CONTRIBUTING\.md|SECURITY\.md|TRAINING\.md|ASSIGNMENT\.md|SOLUTION\.md|Makefile|docker-compose\.(obs|sonar|security)\.yml|docs/|\.github/|\.githooks/|k8s/base/secret\.yaml|swarm/|ansible/group_vars/|security/|vault/|chaos/|services/_shared/|services/orders/Dockerfile|planning/)'
          if grep -rn --exclude-dir=.git 'CHANGE_ME_DEV_ONLY' . \
               | grep -vE "$ALLOWED"; then
            echo "::error::Registered dummy value outside its allowed files. See DUMMY-VALUES.md."
            exit 1
          fi
          echo "clean"

  # ------------------------------------------------------------------- 2. SAST
  sast:
    name: 2 · SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
            p/secrets
            security/semgrep/daig.yml
          generateSarif: true

      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: 2b · CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: codeql

  # -------------------------------------------------------------------- 3. SCA
  dependencies:
    name: 3 · Dependency scanning
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orders, kitchen, dispatch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }

      - name: npm audit
        working-directory: services/${{ matrix.service }}
        run: |
          npm ci --no-audit --no-fund
          # Fail on high and above. A gate that fires on every low finding is a
          # gate people learn to ignore, which is worse than no gate.
          npm audit --audit-level=high

      - name: OSV Scanner
        uses: google/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=services/${{ matrix.service }}/package-lock.json

  # ------------------------------------------------------------- 4. IaC / POLICY
  iac:
    name: 4 · IaC and policy as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy - IaC misconfiguration
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif

      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Checkov
        # Never pin a CI action to a moving branch. Dependabot (github-actions
        # ecosystem) bumps this; for stricter supply-chain posture pin to the
        # release commit SHA instead of the tag.
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        continue-on-error: true
        with:
          directory: infra/
          framework: terraform
          quiet: true

      - name: Conftest - Dockerfile policy
        run: |
          set -euo pipefail
          for svc in orders kitchen dispatch web; do
            echo "--- $svc"
            docker run --rm -v "$PWD:/project" openpolicyagent/conftest:latest \
              test --policy security/policy --parser dockerfile \
              "services/$svc/Dockerfile"
          done

      - name: Conftest - Kubernetes policy
        run: |
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:latest \
            test --policy security/policy k8s/base/

  # ------------------------------------------------------- 5. BUILD, SBOM, SIGN
  build:
    name: 5 · Build, scan, SBOM, sign
    runs-on: ubuntu-latest
    needs: [secrets, sast, dependencies]
    strategy:
      fail-fast: false
      matrix:
        service: [orders, kitchen, dispatch, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          tags: local/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - image vulnerabilities
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'          # this gate BLOCKS
          ignore-unfixed: true    # do not block on something with no available fix

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: local/${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

      - name: Push with provenance and SBOM attestation
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          # SLSA provenance: a signed record of HOW this image was built -
          # which commit, which workflow, which runner.
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign keyless
        if: github.event_name == 'push'
        run: |
          # No private key exists. The signing identity is this workflow, proven
          # by the OIDC token, so a valid signature means "this image came from
          # this pipeline". Nothing to steal, nothing to rotate.
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

      - name: Attach the SBOM as an attestation
        if: github.event_name == 'push'
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.service }}.cdx.json \
            --type cyclonedx \
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  # ------------------------------------------------------------------- 6. DAST
  dast:
    name: 6 · DAST against a running stack
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 240
          ./scripts/seed.sh || true

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: http://localhost:8080
          rules_file_name: security/zap/rules.tsv
          cmd_options: '-I'
          fail_action: true

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ SUMMARY
  gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [secrets, sast, codeql, dependencies, iac, build, dast]
    if: always()
    steps:
      - name: Evaluate
        run: |
          echo "### Security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secrets | ${{ needs.secrets.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SAST | ${{ needs.sast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependencies | ${{ needs.dependencies.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| IaC and policy | ${{ needs.iac.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build, SBOM, sign | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DAST | ${{ needs.dast.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.secrets.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::A blocking gate failed."
            exit 1
          fi

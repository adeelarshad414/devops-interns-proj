name: Security

# Shift-left, made concrete. Four different classes of problem, four scanners.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dependencies rot while you sleep. Weekly re-scan of unchanged code.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan past commits
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, kitchen, dispatch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - working-directory: services/${{ matrix.service }}
        run: |
          npm ci --no-audit --no-fund
          # Report everything, fail only on high and above. A pipeline that
          # fails on every low finding is a pipeline people learn to ignore.
          npm audit --audit-level=high

  images:
    name: Image and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy - filesystem, IaC and config
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  iac:
    name: Terraform static analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: '1.9.5' }

      - name: Format check
        working-directory: infra/${{ matrix.cloud }}
        run: terraform fmt -check -recursive

      - name: Init and validate
        working-directory: infra/${{ matrix.cloud }}
        run: |
          terraform init -backend=false
          terraform validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra/${{ matrix.cloud }}
          # soft_fail: this repo ships deliberately-flagged gaps (TLS-less ALB,
          # single NAT, etc. — all annotated). Report them without failing the
          # run. For a production stack, remove soft_fail to make tfsec blocking.
          soft_fail: true

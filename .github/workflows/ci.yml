name: CI

# The Day 4 lesson lives in this file: a pipeline's most valuable behaviour is
# REFUSING to deploy. Break a test and watch the build stop.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Syntax check every JS file
        run: |
          set -euo pipefail
          find services load scripts -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          echo "javascript syntax clean"

      - name: Syntax check every shell script
        run: |
          set -euo pipefail
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 bash -n
          echo "shell syntax clean"

      - name: Parse every YAML document
        run: |
          python3 -c "
          import yaml, os, sys
          fail = 0
          # os.walk (not glob '**') so hidden dirs like .github are included —
          # the workflow YAML must be parsed too.
          for root, _, files in os.walk('.'):
              if root == './.git' or root.startswith('./.git/'):
                  continue
              for n in files:
                  if n.endswith(('.yml', '.yaml')):
                      f = os.path.join(root, n)
                      try: list(yaml.safe_load_all(open(f)))
                      except Exception as e:
                          print('FAIL', f, e); fail = 1
          sys.exit(fail)"

      - name: Refuse registered dummy values outside their allowed files
        run: |
          set -euo pipefail
          # Single source of truth for the allowlist, identical to devsecops.yml.
          # The registered placeholder legitimately lives in docs, the scanners
          # that detect it (services/_shared/*), the dev-default Dockerfile, the
          # chaos dev scripts, and the dev-only compose/Makefile — see
          # DUMMY-VALUES.md. The gate fires when it appears ANYWHERE ELSE.
          ALLOWED='(\.env\.example|DUMMY-VALUES\.md|README\.md|CONTRIBUTING\.md|SECURITY\.md|TRAINING\.md|ASSIGNMENT\.md|SOLUTION\.md|Makefile|docker-compose\.(obs|sonar|security)\.yml|docs/|\.github/|\.githooks/|k8s/base/secret\.yaml|swarm/|ansible/group_vars/|security/|vault/|chaos/|services/_shared/|services/orders/Dockerfile|planning/)'
          if grep -rn --exclude-dir=.git 'CHANGE_ME_DEV_ONLY' . | grep -vE "$ALLOWED"; then
            echo "::error::Registered dummy value outside its allowed files. See DUMMY-VALUES.md."
            exit 1
          fi
          echo "no stray dummy values"

  test:
    name: Unit tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orders, kitchen, dispatch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install
        working-directory: services/${{ matrix.service }}
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d test ]; then npm test; else echo "no tests yet for ${{ matrix.service }}"; fi

  build:
    name: Build image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [static, test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [orders, kitchen, dispatch, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          # Immutable :<sha> always; the mutable :latest only tracks the default
          # branch, so a feature branch can never move :latest out from under a
          # deploy. Rollback targets a specific sha, never "latest".
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and conditionally push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  integration:
    name: Integration - full stack
    runs-on: ubuntu-latest
    needs: [static, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Bring the stack up
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test every tier
        run: ./scripts/smoke.sh

      - name: Place a real order through all three services
        run: ./scripts/integration-order.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

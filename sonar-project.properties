# SonarQube scanner configuration.
#
# Run locally once SonarQube is up:
#   docker run --rm --network daig_default \
#     -v "$PWD:/usr/src" \
#     -e SONAR_HOST_URL=http://sonarqube:9000 \
#     -e SONAR_TOKEN=<token from the UI> \
#     sonarsource/sonar-scanner-cli

sonar.projectKey=tkxel_daig
sonar.projectName=Daig
sonar.projectVersion=0.1.0

sonar.sources=services,load,scripts
sonar.tests=services/orders/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js,services/web/public/app.css
sonar.test.inclusions=**/*.test.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# The quality gate is the point, not the score. A gate that never fails is
# decoration; a gate that fails on everything gets ignored. New code is held to
# a higher standard than existing code, which is the only policy that is both
# strict and achievable on a codebase that already exists.
sonar.qualitygate.wait=true

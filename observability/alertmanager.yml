# Alertmanager routing for daig.
#
# The teaching point: severity decides the CHANNEL, not just the colour.
# critical → page a human now; warning → a ticket/Slack that can wait until
# morning. Wire the real receivers (Slack webhook, PagerDuty routing key) where
# the placeholders are — they're left empty here so the container starts without
# secrets. An empty receiver is valid and simply drops, which is why nothing
# pages in the demo until you fill it in.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's-switch first. The Watchdog fires continuously; forward it out at
    # a steady cadence so an EXTERNAL monitor can page when the beat stops.
    - matchers: ['alertname="Watchdog"']
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="critical"']
      receiver: pager
      group_wait: 10s
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: ticket

receivers:
  - name: default

  # DEAD-MAN'S-SWITCH sink. The Watchdog alert POSTs here forever; point it at an
  # external heartbeat monitor that alerts when the POSTs STOP. That external
  # signal is the only thing that catches Prometheus/Alertmanager being down -
  # an internal alert cannot fire if the thing that fires alerts is dead.
  - name: watchdog
    # webhook_configs:
    #   - url: https://hc-ping.com/<uuid>   # healthchecks.io / Dead Man's Snitch
    #     send_resolved: false

  # PAGE: fill in a PagerDuty/Opsgenie integration for real paging.
  - name: pager
    # pagerduty_configs:
    #   - routing_key: <PAGERDUTY_ROUTING_KEY>

  # TICKET/SLACK: fill in a Slack incoming-webhook for the warning channel.
  - name: ticket
    # slack_configs:
    #   - api_url: <SLACK_WEBHOOK_URL>
    #     channel: '#daig-alerts'

inhibit_rules:
  # If orders are outright failing (critical), silence the slow-latency warning
  # for the same tier — it's a symptom of the same incident, not a second one.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['tier']

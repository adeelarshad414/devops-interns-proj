global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: daig-local

rule_files:
  - /etc/prometheus/rules/*.yml

# Where firing alerts are delivered. Without this block the SLO rules evaluate
# and go FIRING in the UI but reach nobody — an alert with no delivery path.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: daig-services
    metrics_path: /metrics
    static_configs:
      - targets: ['orders:3001']
        labels: { service: orders, tier: application }
      - targets: ['kitchen:3002']
        labels: { service: kitchen, tier: application }
      - targets: ['dispatch:3003']
        labels: { service: dispatch, tier: application }

  # RED metrics derived from spans by the collector's spanmetrics connector
  # (the exporter endpoint, :8889 - NOT the collector's own health metrics).
  - job_name: otel-spanmetrics
    static_configs:
      - targets: ['otel-collector:8889']

  # The collector's OWN health metrics (:8888) - dropped spans, export failures,
  # queue depth. Without this a dead collector silently takes traces and RED
  # metrics with it. Feeds the DaigObservabilityPipelineDown `up == 0` alert.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: daig-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: daig-services
    metrics_path: /metrics
    static_configs:
      - targets: ['orders:3001']
        labels: { service: orders, tier: application }
      - targets: ['kitchen:3002']
        labels: { service: kitchen, tier: application }
      - targets: ['dispatch:3003']
        labels: { service: dispatch, tier: application }

  # RED metrics derived from spans by the collector's spanmetrics connector.
  - job_name: otel-spanmetrics
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

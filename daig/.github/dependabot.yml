version: 2

# Dependencies rot while you sleep. A weekly bump keeps the surface small and,
# more usefully, keeps the SCA gate green for real reasons rather than because
# someone added an exception.

updates:
  - package-ecosystem: npm
    directory: /services/orders
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /services/kitchen
    schedule: { interval: weekly, day: monday }
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /services/dispatch
    schedule: { interval: weekly, day: monday }
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /services/orders
    schedule: { interval: weekly }
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: terraform
    directory: /infra/aws
    schedule: { interval: monthly }
    commit-message:
      prefix: "chore(infra)"
